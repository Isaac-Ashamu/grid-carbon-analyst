[project]
name = "grid-carbon-analyst"
version = "0.1.0"
description = "A LangGraph agent that answers plain-English questions about the GB grid using the uk-grid-carbon-lakehouse marts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "langgraph>=0.4",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "duckdb>=1.1",
  "sqlglot>=26",
  "pydantic-settings>=2.3",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
gca = "grid_carbon_analyst.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grid_carbon_analyst"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF", "PT", "ISC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/grid_carbon_analyst"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
